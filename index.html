x 0}
</style></head><body><main class="wrap"><header class="top"><div class="brand" id="brand">syn<span>✦</span>ced</div><div id="status" class="pill">FRIENDSHIP CHECK</div></header><div id="app"></div><div class="foot">Quiz data stays on this device. Pro request drafts stay local unless you send them from your mail or messages app.</div></main><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const QUESTIONS=[

['humor','What kind of funny do you love most?',['Dry and understated','Absurd and unpredictable','Playful teasing','Clever wordplay']],
['humor','A friend tells a story you’ve heard before. You…',['Enjoy the encore','Add the missing details','Tease them about the rerun','Suggest a new punchline']],
['humor','Someone roasts you in front of friends. You…',['Roast them right back','Laugh if it’s affectionate','Tell them later if it stung','Change the subject']],
['communication','When something is bothering you, you…',['Say it directly','Need a little time first','Drop hints and hope they notice','Talk it through with someone']],
['communication','A friend shares big news. Your first move?',['Call them right away','Send an excited voice note','Ask thoughtful questions','Celebrate in the group chat']],

['loyalty','What makes you feel most supported?',['Someone shows up when it counts','Consistent little check-ins','Being accepted without fixing me','Someone telling me the honest truth']],
['loyalty','A friend makes a choice you disagree with. You…',['Support them, then share concerns','Ask if they want advice','Say exactly what I think','Trust them to figure it out']],
['conflict','After an argument, you usually…',['Want to resolve it right away','Need space before talking','Send a message to reopen things','Act normal and hope it passes']],

['energy','Your ideal friend hangout is…',['A full day out together','A cozy night in','A quick coffee and a good chat','Doing our own things side by side']],
['energy','After a busy week, friendship time should be…',['Something lively to reset','Calm and unstructured','A little of both','Whenever I have the bandwidth']],

['values','What do you hope a friend remembers?',['I’m always in their corner','They can be unfiltered with me','I make ordinary days better','I tell them the truth with care']]
];
const CATS=['humor','communication','loyalty','conflict','energy','texting habits','plans vs spontaneous','values'];const LABELS={'humor':'Humor','communication':'Communication','loyalty':'Loyalty','conflict':'Conflict','energy':'Energy','texting habits':'Texting','plans vs spontaneous':'Plans vs. spontaneous','values':'Values'};const KEY='synced.v1',app=document.getElementById('app');let data=load(),mode='self',answers=[],idx=0,invite=null,pendingAfterSelf=false,adminTaps=0;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{profile:null,matches:[],pro:false}}catch(e){return{profile:null,matches:[],pro:false}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2100)}function setStatus(s){document.getElementById('status').textContent=s}
function enc(o){let b=unescape(encodeURIComponent(JSON.stringify(o)));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function dec(s){let b=s.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))))}function hashInvite(){let m=location.hash.match(/invite=([^&]+)/);if(!m)return null;try{let x=dec(decodeURIComponent(m[1]));if(x.v===1&&Array.isArray(x.a)&&x.a.length===40)return x;return null}catch(e){return null}}
function home(){mode='home';invite=null;history.replaceState(null,'',location.pathname+location.search);setStatus(data.pro?'PRO UNLOCKED':'FRIENDSHIP CHECK');app.innerHTML=`<section class="screen"><div class="eyebrow">Friendship, in sync</div><h1>How well do<br>you <span style="color:var(--accent)">really</span> click?</h1><p>Answer honestly. Invite your person. Find out where your friendship just works—and where it gets interesting.</p>${data.profile?`<div class="card"><div class="matchrow"><div class="avatar">✦</div><div class="grow"><b>Your profile is ready</b><div class="small">${esc(data.profile.name)} · 40 answers saved on this device</div></div></div></div><button class="primary" id="inviteBtn">＋ &nbsp; Invite a friend</button><button class="secondary" id="retake">Retake my quiz</button>`:`<button class="primary" id="start">Take the quiz</button>`}<div class="sectionTitle">Your matches <span class="small">(${data.matches.length})</span></div>${data.matches.length?data.matches.map((m,i)=>`<button class="card" style="width:100%;text-align:left" data-match="${i}"><div class="matchrow"><div class="avatar">${esc((m.name||'?').slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(m.name)}</b><div class="small">${esc(m.label)}</div></div><div class="pct">${m.score}%</div></div></button>`).join(''):`<div class="empty">Your match list is waiting.<br>Invite a friend to compare answers.</div>`}<hr class="divider"><div class="card"><div class="eyebrow">Synced Pro · one-time $5</div><div class="sectionTitle" style="margin-top:7px">Get the whole story</div><p class="small">Unlock category breakdowns, your friendship dynamics, hangout ideas, conversation starters, and a shareable results card. Lifetime access on this device.</p><button class="primary" id="openPro">${data.pro?'✓ Pro unlocked · codes & requests':'Unlock Pro · $5 or free code'}</button><p class="small" style="margin:12px 2px 0">Manual request only. No automatic sending or payment processing.</p></div><button class="secondary" id="privacy">Privacy & device data</button></section>`;
const start=document.getElementById('start');if(start)start.onclick=()=>begin('self');document.getElementById('retake')?.addEventListener('click',()=>begin('self'));document.getElementById('inviteBtn')?.addEventListener('click',inviteFriend);document.querySelectorAll('[data-match]').forEach(x=>x.onclick=()=>showResult(+x.dataset.match));document.getElementById('openPro').onclick=()=>proScreen(home);document.getElementById('privacy').onclick=()=>alert('Synced stores quiz profiles, matches, Pro status, promo codes, and purchase-request drafts only in this browser’s localStorage. Invite links carry quiz answers in the URL hash. Request information is shared with Mathias only when you send a draft from your own mail or messages app. Hidden admin is device-local, not a secure account or shared inbox. Clear site data to erase local data. No card details or payments are processed.');}
function begin(which){mode=which;answers=which==='self'&&data.profile?[...data.profile.a]:Array(40).fill(null);idx=which==='self'&&data.profile?0:0;quiz();}
function quiz(){setStatus(mode==='self'?'YOUR PROFILE':'FRIEND QUIZ');let [cat,q,opts]=QUESTIONS[idx];app.innerHTML=`<section class="screen"><button class="back" id="back">‹ &nbsp; Back</button><div class="qmeta"><span>${mode==='self'?'Your profile':'Friend quiz'}</span><span>${idx+1} / 40</span></div><div class="bar"><i style="width:${(idx+1)/40*100}%"></i></div><div class="eyebrow">${LABELS[cat]}</div><h2>${q}</h2><div class="choices">${opts.map((o,n)=>`<button class="choice" data-answer="${n}">${o}</button>`).join('')}</div></section>`;document.getElementById('back').onclick=()=>{if(idx>0){idx--;quiz()}else home()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[idx]=+b.dataset.answer;if(idx<39){idx++;quiz()}else nameScreen()});}
function nameScreen(){app.innerHTML=`<section class="screen"><div class="eyebrow">That’s a wrap</div><h1>${mode==='self'?'Your profile is ready.':'One last thing.'}</h1><p>${mode==='self'?'What should friends call you?':'What should we call you in your match list?'}</p><input class="field" id="name" maxlength="28" placeholder="Your name" autocomplete="given-name"><button class="primary" id="finish">${mode==='self'?'Save my profile':'See our results'} →</button><button class="back" id="cancel">‹ &nbsp; Back to quiz</button></section>`;document.getElementById('finish').onclick=()=>{let name=document.getElementById('name').value.trim()||(mode==='self'?'Me':'Friend');if(mode==='self'){data.profile={name,a:[...answers]};save();if(pendingAfterSelf&&invite){pendingAfterSelf=false;mode='friend';answers=Array(40).fill(null);idx=0;quiz();return}home();toast('Profile saved on this device')}else{if(!data.profile){toast('Create your own profile first');home();return}let base=invite&&invite.a?invite.a:data.profile.a,score=calc(base,answers),m={id:Date.now(),name,a:[...answers],base:[...base],score,label:labelFor(score),insight:insight(base,answers)};data.matches.unshift(m);save();history.replaceState(null,'',location.pathname+location.search);showResult(0)} };document.getElementById('cancel').onclick=()=>{idx=39;quiz()};}
function inviteFriend(){if(!data.profile)return;let url=location.href.split('#')[0]+'#invite='+encodeURIComponent(enc({v:1,n:data.profile.name,a:data.profile.a}));if(navigator.share)navigator.share({title:'Take the Synced friendship quiz',text:`${data.profile.name} invited you to compare friendship styles.`,url}).catch(()=>copy(url));else copy(url);}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Invite link copied — send it to your friend')}catch(e){prompt('Copy this invite link:',s)}}
function calc(a,b){let sum=0;for(let i=0;i<40;i++)sum+=Math.max(0,1-Math.abs((a[i]||0)-(b[i]||0))/3);return Math.round(sum/40*100)}function catScores(a,b){let obj={};CATS.forEach(c=>{let ids=QUESTIONS.map((q,i)=>q[0]===c?i:-1).filter(i=>i>=0);obj[c]=Math.round(ids.reduce((s,i)=>s+Math.max(0,1-Math.abs((a[i]||0)-(b[i]||0))/3),0)/ids.length*100)});return obj}function labelFor(s){return s>=85?'Locked in':s>=70?'Solid':s>=52?'Chaotic but fun':'We should talk'}
function insight(a,b){let cs=catScores(a,b),best=Object.entries(cs).sort((x,y)=>y[1]-x[1])[0],low=Object.entries(cs).sort((x,y)=>x[1]-y[1])[0];return best[1]>=78?`You’re especially in sync on ${LABELS[best[0]].toLowerCase()}—that shared rhythm is a real strength.`:`Your easiest point of connection is ${LABELS[best[0]].toLowerCase()}; give each other extra grace around ${LABELS[low[0]].toLowerCase()}.`}
function showResult(i){let m=data.matches[i];if(!m)return home();let base=m.base||data.profile.a,cs=catScores(base,m.a);let best=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0],low=Object.entries(cs).sort((a,b)=>a[1]-b[1])[0];let locked=!data.pro;let report=`<div class="card"><div class="sectionTitle" style="margin-top:0">Category chemistry</div>${CATS.map(c=>`<div class="category"><span>${LABELS[c]}</span><b>${cs[c]}%</b></div><div class="mini"><i style="width:${cs[c]}%"></i></div>`).join('')}<div class="sectionTitle">Where you click</div><p>You naturally meet each other around <b>${LABELS[best[0]].toLowerCase()}</b>. Keep that shared strength in the mix when life gets busy.</p><div class="sectionTitle">Where you might clash</div><p><b>${LABELS[low[0]]}</b> is your biggest difference. Name what you need rather than expecting the other person to guess.</p><div class="sectionTitle">Your friendship styles</div><p><b>Conflict:</b> ${styleText('conflict',base,m.a)}<br><b>Texting:</b> ${styleText('texting habits',base,m.a)}</p><div class="sectionTitle">Perfect hangout</div><p>${hangout(base,m.a)}</p><div class="sectionTitle">Conversation starters</div><ul class="list"><li>What’s a tiny thing that always improves your day?</li><li>Which kind of support feels best when life gets messy?</li><li>What spontaneous plan would you actually say yes to?</li></ul></div>`;app.innerHTML=`<section class="screen"><button class="back" id="homeback">‹ &nbsp; All matches</button><div class="eyebrow">Your friendship snapshot</div><h2>${esc(data.profile.name)} + ${esc(m.name)}</h2><div class="card" style="text-align:center"><div class="score">${m.score}%</div><div class="label">${m.label}</div><p style="margin:10px 0 0">${esc(m.insight)}</p></div>${locked?`<div style="position:relative"><div class="blurred">${report}</div><div style="position:absolute;inset:0;display:grid;place-items:center"><div class="card" style="text-align:center;max-width:320px;box-shadow:0 12px 45px #0009"><div style="font-size:30px">🔒</div><b>There’s more to your story</b><p class="small" style="margin:8px 0">Unlock category scores, your friendship dynamic, and a shareable results card.</p><button class="primary" id="unlock">Unlock Pro · $5 or free code</button><div class="small">Manual request or promo code. No automatic charge.</div></div></div></div>`:report}<button class="secondary" id="share">Share results</button><button class="secondary" id="remove">Remove this match</button></section>`;document.getElementById('homeback').onclick=home;document.getElementById('unlock')?.addEventListener('click',()=>proScreen(()=>showResult(i)));document.getElementById('share').onclick=()=>shareCard(m,cs);document.getElementById('remove').onclick=()=>{if(confirm(`Remove ${m.name} from your matches?`)){data.matches.splice(i,1);save();home()}};}
function styleText(cat,a,b){let ia=QUESTIONS.map((q,i)=>q[0]===cat?i:-1).filter(i=>i>=0),avg=(x)=>ia.reduce((s,i)=>s+(x[i]||0),0)/ia.length,d=Math.abs(avg(a)-avg(b));return d<.6?'You tend to approach it similarly; make room for honest check-ins.':avg(a)>avg(b)?'One of you may want to address things sooner, while the other needs space first. Agree on a pause and a time to reconnect.':'One of you may need space before talking, while the other wants to resolve things quickly. Agree on a pause and a time to reconnect.'}function hangout(a,b){let p=QUESTIONS.findIndex(q=>q[0]==='energy'),s=QUESTIONS.findIndex(q=>q[0]==='plans vs spontaneous'),social=((a[p]||0)+(b[p]||0))/2,plan=((a[s]||0)+(b[s]||0))/2;return social<1.2?'A cozy meal, a slow walk, and plenty of unrushed conversation.':plan>1.5?'Pick one fun anchor activity, then leave the rest of the day open.':'A low-pressure coffee or casual food stop, with an easy option to extend the hangout.'}
